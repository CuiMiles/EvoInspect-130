[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoinspect-130"
version = "0.1.0"
description = "Leakage-aware research and evaluation toolkit for EvoInspect-130"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=10.3"]
video = ["opencv-python-headless>=4.10", "PyYAML>=6.0"]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]
yaml = ["PyYAML>=6.0"]
metrics = ["numpy>=2.0", "scipy>=1.11"]
research = [
  "scikit-learn>=1.6,<2",
  "torch==2.6.0",
  "torchvision==0.21.0",
]

[project.scripts]
evoinspect = "evoinspect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["evoinspect"]
