spec_version: "2.1"
updated_at: "2026-08-28"
project:
  name_zh: "智检演化130"
  name_en: "EvoInspect-130"
  subtitle: "面向100正常+30缺陷样本快速迁移的可信自学习实时AOI系统"
  objective: "按国一/华为专项奖标准构建；以真实创新、性能和完整度最大化国奖概率"
  award_guarantee: false
  research_horizon_weeks: 16
team:
  name: Cuisine
  leader: 崔明浩
  members: [崔明浩]
  school: 西安交通大学
  competition_group: null
  division_of_work: "单人团队；全部工作由崔明浩独立完成。"

sources:
  official_notice: "https://cpipc.acge.org.cn/cw/contestNews/detail/2c9088a5696cbf370169a3f8101510bd/2c9080179e403028019e496a8feb14b9?page=0"
  huawei_topic_pdf: "https://statics.scnu.edu.cn/pics/yjsy/2026/0617/1781679006478549.pdf"
  authority_order:
    - current_official_notice_and_attachments
    - written_organizer_clarification
    - project_spec
    - primary_papers_and_upstream_code
    - agent_inference

official_problem:
  title: "可自学习的AOI实时在线AI质检"
  inputs: [image, video]
  anomaly_scope:
    - dimensional_deviation
    - missing_or_extra_component
    - appearance_defect
    - color_change
    - logical_error
    - sequence_error
  adaptation_support:
    normal_samples: 100
    defective_samples: 30
  hidden_test_min_images: 1000
  target_image_resolution: [2500, 2500]
  target_gpu: "GTX 2060 or lower"
  target_model_runtime_ms_lt: 200
  cpu_challenge_runtime_s_lt: 2
  public_data_required: true
  explainability_document_required: true
  model_code_required: true
  model_usage_document_required: true
  small_model_encouraged: true
  score:
    competition_percent: 60
    expert_percent: 40
    competition_subweights:
      completeness_percent: 50
      accuracy_percent: 20
      detection_time_percent: 30

research_thesis:
  core: "冻结PatchCore精度引擎，并以相同100+30隔离协议复现EfficientAD-M边缘候选；M不要求超过PatchCore，但必须通过预注册质量线。"
  deployment: "通过统一InferenceEngine显式切换Accuracy/Edge，冻结模型后在真实GTX2060上测量2500x2500 model-only与end-to-end时延。"
  self_learning: "GuardedAdapt-v1保留为离线安全机制；GuardedAdapt-Risk预注册实验因接受率为0失败，不再承担正向核心创新。"

primary_innovations:
  - id: I3
    name: "GuardedAdapt"
    zh: "带回放门禁、影子验证和回滚的可信反馈闭环"
    type: system
    mandatory_ablation: true
    status: failed_preregistered_positive_gate
    claim_role: engineering_safety_and_negative_result_only

preliminary_submission_freeze:
  effective_date: "2026-08-27"
  decision_doc: docs/18_PRELIMINARY_SUBMISSION_FREEZE.md
  accuracy_engine: PatchCore
  edge_engine_primary_candidate: EfficientAD-M
  edge_engine_primary_status: failed_frozen_quality_gate
  edge_engine_speed_fallback: EfficientAD-S
  edge_engine_speed_fallback_status: failed_frozen_quality_gate_speed_diagnostic_only
  edge_latency_representative: "EfficientAD-M bottle seed143, predeclared before training"
  remote_handoff: docs/19_REMOTE_2060_HANDOFF.md
  efficientad_m_quality_gate:
    overall_f1_min: 0.89
    unseen_f1_min: 0.83
    image_auroc_min: 0.97
    all_15_categories_complete: true
    test_label_leakage_max: 0
  frozen_negative_only: [RCBR, GuardedAdapt-Risk, EfficientAD-M, EfficientAD-S]
  stopped_research: [HeteroMemory, GuardedFusion, MaskedPrototype, TriSynth]
  paused_until_submission_closure:
    - DAGM_2007
    - MVTec_AD_2
    - MVTec_LOCO_AD
    - AnomalyDINO
    - AHL_or_DRA
    - RealNet_or_GLASS
    - cpu_under_2s

online_graph:
  maximum_neural_models: 3
  forbidden:
    - remote_api
    - large_language_model
    - large_diffusion_model
    - unmeasured_hardware_claims
  desired_package_mb: 180
  hard_internal_package_mb_max: 300

internal_targets:
  quality:
    image_auroc_mean_target: 0.97
    image_ap_mean_target: 0.95
    pixel_auroc_mean_target: 0.95
    aupro_target: 0.90
    f1_target: 0.88
    unseen_defect_f1_target: 0.82
    logical_anomaly_f1_target: 0.85
    calibration_ece_max: 0.05
  deployment:
    rtx3090_2500_end_to_end_p95_ms_target: 70
    gtx2060_2500_end_to_end_p95_ms_target: 180
    cpu_2500_end_to_end_p95_s_stretch: 1.8
    adaptation_minutes_target: 10
    final_model_mb_target: 150
  continual:
    feedback_gain_f1_points_target: 5
    anchor_regression_f1_points_max: 1
    rollback_success_rate: 1.0

baseline_families:
  - EfficientAD
  - PatchCore
  - AnomalyDINO
  - AHL_or_DRA
  - RealNet_or_GLASS
  - simple_incremental_memory_baseline

required_datasets:
  - MVTec_AD
  - DAGM_2007
  - MVTec_LOCO_AD
  - MVTec_AD_2
optional_datasets:
  - VisA
  - MPDD
  - Real_IAD
  - HSS_IAD

required_protocols:
  - standard_public_benchmark
  - official_100_normal_30_defective
  - unseen_defect_type_holdout
  - held_out_product_category
  - lighting_and_camera_shift
  - high_resolution_small_defect
  - feedback_stream_with_drift
  - image_and_video

required_outputs:
  - anomaly_score
  - binary_decision
  - anomaly_mask_or_regions
  - known_or_unknown_defect_tag
  - calibrated_confidence
  - component_or_process_step
  - nearest_normal_evidence
  - latency_breakdown
  - model_version
  - video_event_intervals

repo_truth_files:
  status: "STATUS.md"
  experiment_registry: "evidence/experiment_registry.csv"
  claim_ledger: "evidence/claim_ledger.csv"
  dataset_registry: "data/dataset_registry.yaml"
  model_registry: "artifacts/model_registry.yaml"
