schema_version: 1
model_id: patchcore-lite-wrn50-layer2-random-coreset+logreg
backbone: torchvision.wide_resnet50_2
weights: IMAGENET1K_V2
input_resolution: [224, 224]
patch_layer: layer2
train_batch_size: 16
coreset_size: 2048
coreset_strategy: seeded_random_patch_subset
logistic_regression:
  c: 1.0
  max_iter: 1000
inference:
  batch_size: 1
  warmup_iterations: 10
  precision: fp32
threshold_selection: development_f1
protocol:
  normal_support_target: 100
  anomaly_support_target: 30
  development_normal_target: 20
  development_anomaly_target: 6
  insufficient_data_policy: reduce_support_to_preserve_development_and_final_test
  unseen_defect_policy: lexicographically_last_defect_type
